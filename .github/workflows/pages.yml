name: Deploy static site to Pages

on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Set up image checker
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ensure article images and card thumbnails
        run: |
          python -m pip install beautifulsoup4==4.15.0
          python scripts/enhance_project.py --root '.' --project 'claude-ai-guide'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
